plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// versionCode 用 git 提交数自动递增，避免手动改
def gitVersionCode() {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, project.projectDir)
        proc.waitFor()
        return proc.text.trim().toInteger()
    } catch (Exception e) {
        println "warning: git rev-list failed (${e.message}); versionCode falls back to 1"
        return 1
    }
}

android {
    namespace = 'com.hanazar.guandanserver'
    compileSdk 37

    defaultConfig {
        applicationId "com.hanazar.guandanserver"
        minSdk 26
        targetSdk 34
        versionCode gitVersionCode()
        versionName "1.6.7"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The family-edition engine remains Python. Chaquopy packages its runtime and
// the existing game rules into the Android app so the hotspot host phone does
// not need a computer or an Internet connection while playing.
chaquopy {
    defaultConfig {
        // Python 3.11 has Android wheels for the numeric dependency used by
        // the family edition.
        version = "3.11"
        pip {
            install("numpy")
            install("flask")
            install("flask-cors")
            install("flask-socketio")
            install("simple-websocket")
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation "com.google.android.material:material:${materialVersion}"
}
