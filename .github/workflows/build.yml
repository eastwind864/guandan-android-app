name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy uses this matching interpreter to resolve the Python
      # requirements which are bundled into the Android package.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify embedded Python imports
        run: |
          python -m pip install numpy flask flask-cors flask-socketio simple-websocket termcolor
          PYTHONPATH=app/src/main/python python -c "import family_backend.mobile_server; print('family backend imports OK')"

      # Android SDK
      - uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias guandan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass PASSWORD -keypass PASSWORD -dname "CN=Guandan Server, OU=Hanazar, O=Hanazar Games, L=NA, S=NA, C=CN" > /dev/null 2>&1
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:PASSWORD --key-pass pass:PASSWORD \
            --out app/build/outputs/apk/release/signed.apk app/build/outputs/apk/release/*-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Keep one public, stable download URL so the phone cannot accidentally
      # receive an older Actions artifact with the same generic file name.
      - name: Publish latest family edition APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/signed.apk Guandan-Family-latest.apk
          if gh release view family-latest >/dev/null 2>&1; then
            gh release upload family-latest Guandan-Family-latest.apk --clobber
          else
            gh release create family-latest Guandan-Family-latest.apk \
              --title "掌上掼蛋·家庭版（最新测试版）" \
              --notes "家庭版手机热点联机测试包。安装后由主手机运行内置服务器，其他手机通过热点或同一局域网加入。"
          fi
