name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy uses this matching interpreter to resolve the Python
      # requirements which are bundled into the Android package.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK
      - uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias guandan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass PASSWORD -keypass PASSWORD -dname "CN=Guandan Server, OU=Hanazar, O=Hanazar Games, L=NA, S=NA, C=CN" > /dev/null 2>&1
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:PASSWORD --key-pass pass:PASSWORD \
            --out app/build/outputs/apk/release/signed.apk app/build/outputs/apk/release/*-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
